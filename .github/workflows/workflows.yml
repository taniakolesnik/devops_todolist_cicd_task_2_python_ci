name: ccid_task_2
run-name: ${{ github.actor }} triggered with ${{ github.sha }}

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  PYTHON_VERSION : 3.8

jobs:
  python-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov pytest-django
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Coverage report
        run: |
          pytest -v --cov=. --cov-report=term-missing

      - name: Lint
        run: |
          flake8 . --show-source --statistics --exit-zero


      - name: Code complexity check
        run: |
          flake8 . --statistics --max-complexity=10 --exit-zero


      - name: Upload Python code
        uses: actions/upload-artifact@v4
        with:
          name: python-source
          path: .